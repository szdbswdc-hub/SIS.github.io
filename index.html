<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Frame | 摄影集</title>
    <style>
        /* 基础重置与变量 */
        :root {
            --bg-color: #0d0d0d;
            --text-main: #f0f0f0;
            --text-muted: #888;
            --accent-color: #b75c74;
            --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* 顶部导航栏 */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .logo { font-family: var(--font-serif); font-size: 1.2rem; letter-spacing: 1px; }
        
        .nav-links { display: flex; align-items: center; gap: 20px; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-size: 0.9rem; opacity: 0.8; transition: opacity 0.3s; }
        .nav-links a:hover { opacity: 1; }
        
        .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            border: 1px solid var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; margin-left: 10px;
        }

        /* 主体布局 */
        main { position: relative; height: 100vh; width: 100vw; }

        /* 背景大图 */
        .background-image {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
            transition: opacity 0.4s ease-in-out;
            cursor: pointer; /* 增加指针样式提示可点击 */
        }

        /* 左侧信息侧边栏 */
        .sidebar {
            position: absolute; top: 0; left: 0; width: 380px; height: 100%;
            background: linear-gradient(to right, rgba(20, 22, 20, 0.95) 20%, rgba(30, 40, 35, 0.6) 80%, transparent 100%);
            z-index: 10; padding: 100px 40px 40px 40px;
            display: flex; flex-direction: column;
            pointer-events: none; /* 让侧边栏不阻挡手势滑动 */
        }
        
        /* 恢复侧边栏内元素的点击事件 */
        .sidebar > * { pointer-events: auto; } 

        .back-link { color: var(--text-main); text-decoration: none; font-size: 0.8rem; margin-bottom: 40px; letter-spacing: 1px; }
        .chapter-meta { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
        .title { font-family: var(--font-serif); font-size: 4rem; font-weight: normal; line-height: 1; }
        .divider { width: 50px; height: 4px; background-color: var(--accent-color); margin: 15px 0; }
        .subtitle { font-size: 1.8rem; font-weight: 300; margin-bottom: 10px; letter-spacing: 2px; }
        .keywords { font-size: 0.8rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 60px; }

        /* 图片网格序号 */
        .grid-numbers {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px;
            font-size: 0.75rem; color: var(--text-muted); margin-bottom: 40px; width: 80%;
        }
        .grid-numbers span { cursor: pointer; transition: color 0.3s; padding: 5px 0;}
        .grid-numbers span:hover { color: var(--text-main); }
        .grid-numbers span.active { color: var(--accent-color); }

        .tags { display: flex; gap: 15px; font-size: 0.7rem; font-weight: bold; letter-spacing: 1px; margin-bottom: auto; }
        .bottom-nav { font-size: 0.9rem; letter-spacing: 2px; font-family: var(--font-serif); display: flex; justify-content: space-between; }

        /* 轮播控制 */
        .controls {
            position: absolute; top: 50%; left: 380px; right: 40px;
            display: flex; justify-content: space-between; z-index: 20;
            transform: translateY(-50%); pointer-events: none;
        }
        .arrow {
            background: none; border: none; color: white; font-size: 2.5rem;
            cursor: pointer; pointer-events: auto; opacity: 0; 
            transition: opacity 0.3s; padding: 20px;
        }
        /* 鼠标靠近两边时显示箭头，平时隐藏使画面更干净 */
        .controls:hover .arrow { opacity: 0.3; }
        .controls .arrow:hover { opacity: 1; }

        /* 底部进度条 */
        .progress-section {
            position: absolute; bottom: 30px; left: 400px; right: 40px; z-index: 20;
            display: flex; align-items: center; gap: 20px; pointer-events: none;
        }
        .counter { font-size: 0.8rem; font-family: monospace; }
        .progress-bars { flex-grow: 1; display: flex; gap: 5px; }
        .bar { flex-grow: 1; height: 3px; background-color: rgba(255,255,255,0.2); }
        .bar-fill { height: 100%; width: 0; background-color: var(--accent-color); transition: width 0.3s; }
        .bar.active .bar-fill { width: 100%; }
        .location-tag { font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; }

        /* 移动端适配适配 */
        @media (max-width: 768px) {
            .sidebar { width: 100%; background: linear-gradient(to bottom, rgba(20,22,20,0.8) 0%, transparent 100%); padding: 80px 20px 20px 20px; }
            .controls { left: 0; right: 0; }
            .progress-section { left: 20px; right: 20px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="logo">Quiet Frame</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#">旅行</a>
            <div class="avatar">N</div>
        </div>
    </header>

    <main>
        <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=2070&auto=format&fit=crop" alt="Gallery Image" class="background-image" id="main-image">

        <aside class="sidebar">
            <a href="#" class="back-link">← INDEX</a>
            <div>
                <div class="chapter-meta">CHAPTER 03 · KANSAI · JAPAN</div>
                <h1 class="title">UJI</h1>
                <div class="divider"></div>
                <h2 class="subtitle">宇治</h2>
                <div class="keywords">river · tea · quiet</div>
            </div>
            <div class="grid-numbers" id="grid-numbers"></div>
            <div class="tags">
                <span>2025</span> <span>KANSAI</span> <span>JAPAN</span> <span>ROLL 01</span>
            </div>
            <div class="bottom-nav">
                <span>← EXPO2025</span> <span>KYOTO →</span>
            </div>
        </aside>

        <div class="controls">
            <button class="arrow" id="prev-btn">⟨</button>
            <button class="arrow" id="next-btn">⟩</button>
        </div>

        <div class="progress-section">
            <div class="counter" id="counter">01/09</div>
            <div class="progress-bars" id="progress-bars"></div>
            <div class="location-tag">UJI</div>
        </div>
    </main>

    <script>
        const images = [
            "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=2070&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1528360983277-13d401cdc186?q=80&w=2070&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1492571350019-22de08371fd3?q=80&w=1953&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?q=80&w=2070&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1624253321171-1be53e12f5f4?q=80&w=2070&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1578469645762-461d4b8e5d60?q=80&w=2069&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1542051812871-757508240f58?q=80&w=2070&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1524413840807-0c3cb6fa808d?q=80&w=2070&auto=format&fit=crop",
            "https://images.unsplash.com/photo-1504109586057-7a2ae83d1338?q=80&w=2070&auto=format&fit=crop"
        ];

        let currentIndex = 0;
        const totalImages = images.length;
        let isAnimating = false; // 防止快速连按导致动画闪烁

        const mainImage = document.getElementById('main-image');
        const gridNumbersContainer = document.getElementById('grid-numbers');
        const progressBarsContainer = document.getElementById('progress-bars');
        const counterText = document.getElementById('counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function init() {
            for (let i = 0; i < totalImages; i++) {
                const numSpan = document.createElement('span');
                numSpan.textContent = String(i + 1).padStart(2, '0');
                numSpan.addEventListener('click', () => changeImage(i));
                gridNumbersContainer.appendChild(numSpan);

                const bar = document.createElement('div');
                bar.className = 'bar';
                const barFill = document.createElement('div');
                barFill.className = 'bar-fill';
                bar.appendChild(barFill);
                progressBarsContainer.appendChild(bar);
            }
            updateUI();
            preloadImages(); // 初始化时预加载第二张
        }

        function changeImage(index) {
            if (isAnimating || index === currentIndex) return;
            isAnimating = true;

            // 处理循环边界
            if (index < 0) index = totalImages - 1;
            if (index >= totalImages) index = 0;
            currentIndex = index;

            // 淡入淡出动画
            mainImage.style.opacity = 0.4;
            setTimeout(() => {
                mainImage.src = images[currentIndex];
                mainImage.style.opacity = 1;
                
                // 动画结束后解除锁定并预加载
                setTimeout(() => {
                    isAnimating = false;
                    preloadImages();
                }, 400); 
            }, 300);

            updateUI();
        }

        // 预加载相邻图片，解决网络延迟导致的白屏
        function preloadImages() {
            const nextIdx = (currentIndex + 1) % totalImages;
            const prevIdx = (currentIndex - 1 + totalImages) % totalImages;
            const imgNext = new Image(); imgNext.src = images[nextIdx];
            const imgPrev = new Image(); imgPrev.src = images[prevIdx];
        }

        function updateUI() {
            counterText.textContent = `${String(currentIndex + 1).padStart(2, '0')}/${String(totalImages).padStart(2, '0')}`;
            
            const numberSpans = gridNumbersContainer.querySelectorAll('span');
            numberSpans.forEach((span, idx) => {
                span.classList.toggle('active', idx === currentIndex);
            });

            const bars = progressBarsContainer.querySelectorAll('.bar');
            bars.forEach((bar, idx) => {
                bar.classList.toggle('active', idx <= currentIndex);
            });
        }

        // 1. 按钮与键盘支持
        prevBtn.addEventListener('click', () => changeImage(currentIndex - 1));
        nextBtn.addEventListener('click', () => changeImage(currentIndex + 1));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeImage(currentIndex - 1);
            if (e.key === 'ArrowRight') changeImage(currentIndex + 1);
        });

        // 2. 点击图片主体直接下一张
        mainImage.addEventListener('click', () => changeImage(currentIndex + 1));

        // 3. 鼠标滚轮/触控板滑动支持 (带防抖机制)
        let wheelTimeout;
        document.addEventListener('wheel', (e) => {
            if (wheelTimeout) return; // 处于冷却时间内则忽略
            if (e.deltaY > 20) {
                changeImage(currentIndex + 1); // 往下滚 -> 下一张
                setWheelCooldown();
            } else if (e.deltaY < -20) {
                changeImage(currentIndex - 1); // 往上滚 -> 上一张
                setWheelCooldown();
            }
        });
        function setWheelCooldown() {
            wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 1000); // 1秒冷却，防止触控板一次滑动切好几张
        }

        // 4. 移动端触摸滑动支持 (Swipe)
        let touchStartX = 0;
        let touchEndX = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50; // 最小滑动距离判定
            if (touchStartX - touchEndX > swipeThreshold) {
                changeImage(currentIndex + 1); // 向左滑 -> 下一张
            } else if (touchEndX - touchStartX > swipeThreshold) {
                changeImage(currentIndex - 1); // 向右滑 -> 上一张
            }
        }

        // 启动
        init();
    </script>
</body>
</html>
